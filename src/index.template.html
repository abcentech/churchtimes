<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script id="public-base-bootstrap">
      // Preserve relative exported assets on clean report URLs and Pages subpaths.
      if (!document.querySelector('base')) {
        const base = document.createElement('base');
        const path = location.pathname;
        const report = path.match(/^(.*\/)reports\/[^/]+\/?$/);
        base.href = report ? report[1] : path.endsWith('/') ? path : path.slice(0, path.lastIndexOf('/') + 1);
        document.head.prepend(base);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172b2e">
