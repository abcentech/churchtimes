<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#173b32"/><text x="75" y="112" font-family="Georgia,serif" font-size="70" fill="#f6f3ea" letter-spacing="-4">Church<tspan font-weight="normal">Times</tspan></text><text x="80" y="149" font-family="Arial,sans-serif" font-size="17" fill="#f6f3ea" letter-spacing="8">NIGERIA</text><rect x="75" y="300" width="930" height="760" fill="#dfe5d8"/><text x="125" y="385" font-family="Arial,sans-serif" font-size="20" letter-spacing="3" fill="#173b32">OUR PROPOSED EDITORIAL PROMISE</text><text x="125" y="535" font-family="Georgia,serif" font-size="91" fill="#173b32"><tspan x="125">Good journalism.</tspan><tspan x="125" dy="110" font-style="italic">A deeper</tspan><tspan x="125" dy="110" font-style="italic">purpose.</tspan></text><text x="125" y="965" font-family="Arial,sans-serif" font-size="26" fill="#173b32"><tspan x="125">Ask better questions.</tspan><tspan x="125" dy="43">Tell the whole story.</tspan></text><text x="75" y="1210" font-family="Arial,sans-serif" font-size="22" fill="#f6f3ea">Faith. People. Public life.</text><text x="75" y="1300" font-family="Arial,sans-serif" font-size="15" fill="#dfe5d8">PROPOSED BRAND EXPRESSION · NOT A FOUNDER QUOTATION</text></svg>