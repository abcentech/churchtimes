name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --workers=2
      - name: Select the compiled-site publishing method
        uses: actions/github-script@v8
        with:
          script: |
            const repository = context.repo;
            const { data: pages } = await github.request('GET /repos/{owner}/{repo}/pages', repository);
            if (pages.build_type !== 'workflow') {
              await github.request('PUT /repos/{owner}/{repo}/pages', {
                ...repository,
                build_type: 'workflow'
              });
              core.info('Pages now publishes the compiled Actions artifact instead of the source branch.');
            } else {
              core.info('Pages is already configured for Actions artifacts.');
            }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
