name: CMS checks

on:
  pull_request:
    paths:
      - 'apps/cms/**'
      - '.github/workflows/cms.yml'
  push:
    branches:
      - feat/newsroom-mvp
      - agent/payload-core
    paths:
      - 'apps/cms/**'
      - '.github/workflows/cms.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: churchtimes
          POSTGRES_PASSWORD: churchtimes-ci
          POSTGRES_DB: churchtimes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U churchtimes -d churchtimes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/cms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate CI-only secrets
        # Random per run, prefixed so they are obviously not real. Never hardcode secrets here.
        run: |
          echo "PAYLOAD_SECRET=ci-only-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PREVIEW_SECRET=ci-only-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "IP_HASH_SALT=ci-only-$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate database
        env:
          DATABASE_URL: postgres://churchtimes:churchtimes-ci@127.0.0.1:5432/churchtimes_test
        run: npm run migrate

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://churchtimes:churchtimes-ci@127.0.0.1:5432/churchtimes_test
        run: npm test

      - name: Build
        env:
          DATABASE_URL: postgres://churchtimes:churchtimes-ci@127.0.0.1:5432/churchtimes_test
        run: npm run build
