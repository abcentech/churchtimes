name: Website checks
on:
  push:
    branches: [main, feat/newsroom-mvp]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check:pages
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --workers=2
      - run: npm run test:newsroom -- --workers=2
      - run: npm run test:forms -- --workers=2
      - run: npm run test:advertising -- --workers=2
