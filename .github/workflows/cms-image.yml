name: CMS staging image

# Builds apps/cms/Dockerfile on GitHub's runners and pushes it to GHCR as ghcr.io/abcentech/churchtimes-cms,
# because the staging VPS (1 vCPU / 2 GB) has too little memory for `next build`. The VPS only pulls and runs
# the image (deploy/staging/README.md). The same Dockerfile is built, migrated and smoke-tested by
# cms-docker.yml on every pull request that touches apps/cms.
#
# No secrets are baked into the image (cms-docker.yml checks this). Runtime secrets live only in
# deploy/staging/.env.cms on the VPS. Tags: the full commit SHA (immutable) and "staging" (moving).
# Owner decision 2026-10-14: build in GitHub, VPS pulls. Keep the package private in its GitHub settings.

on:
  push:
    branches:
      - feat/newsroom-mvp
    paths:
      - 'apps/cms/**'
      - '.github/workflows/cms-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cms-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/abcentech/churchtimes-cms

jobs:
  build-push:
    # Never publish from a fork or any branch other than the integration branch.
    if: github.repository == 'abcentech/churchtimes' && github.ref == 'refs/heads/feat/newsroom-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/cms
          file: apps/cms/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:staging
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Church Times CMS (staging build from feat/newsroom-mvp)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "Pushed \`${IMAGE}:${GITHUB_SHA}\` and \`${IMAGE}:staging\`."
            echo
            echo "On the VPS: \`sudo deploy/staging/update.sh ${GITHUB_SHA}\` (see deploy/staging/README.md)."
          } >> "$GITHUB_STEP_SUMMARY"
